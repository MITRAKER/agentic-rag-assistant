[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-assistant"
version = "0.1.0"
description = "Agentic RAG knowledge assistant: grounded answers with citations over your own documents."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "qdrant-client>=1.9",
    "fastembed>=0.3",
    "pypdf>=4.0",
    "beautifulsoup4>=4.12",
    "pydantic-settings>=2.0",
    "typer>=0.12",
    "anthropic>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
rag = "rag_assistant.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
