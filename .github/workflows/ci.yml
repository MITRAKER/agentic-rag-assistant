# Continuous integration: every pull request and every push to main runs the
# same checks a careful reviewer would, so nothing reaches main without them.
# LEARNING.md ("Engineering standards") explains each job.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Every Monday: new vulnerabilities and new dependency releases can break
    # the project even when our own code hasn't changed.
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Least privilege: the jobs only read the code. No job here can push or publish.
permissions:
  contents: read

# A new push to a pull request cancels its older, now pointless, run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DEFAULT_PYTHON: "3.13"
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    name: Lint, format, types, Power of Ten
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the project and its dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run every pre-commit hook on every file
        env:
          RUFF_OUTPUT_FORMAT: github  # show lint errors as annotations on the PR
        run: pre-commit run --all-files --show-diff-on-failure

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false  # one failing version shouldn't hide the others' results
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the project and its dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run the tests with branch coverage (fails below 90%)
        run: pytest --cov --cov-report=term-missing
      - name: Add the coverage table to the run summary
        if: matrix.python-version == env.DEFAULT_PYTHON
        run: coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  security:
    name: Security scans
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the project and its dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Bandit (insecure code patterns)
        run: bandit -c pyproject.toml -r src tools
      - name: pip-audit (dependencies with known vulnerabilities)
        run: pip-audit --skip-editable --progress-spinner off

  build:
    name: Build and smoke-test the package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the project and its dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Build the wheel and source distribution
        run: python -m build
      - name: Install the wheel in a fresh environment and use it
        env:
          RAG_EMBEDDER: hashing  # offline: no model download
          RAG_LLM: extractive  # offline: no API key
          RAG_QDRANT_PATH: ${{ runner.temp }}/smoke-db
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/smoke/bin/rag" --help
          "$RUNNER_TEMP/smoke/bin/rag" ingest "$GITHUB_WORKSPACE/data/sample"
          "$RUNNER_TEMP/smoke/bin/rag" ask "How does Qdrant find similar vectors quickly?"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 14

  # One stable check name to require in branch protection, however the jobs
  # above change (for example when a Python version is added to the matrix).
  ci-passed:
    name: CI passed
    if: always()
    needs: [quality, test, security, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check that every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A required job finished with '$result'."
              exit 1
            fi
          done
