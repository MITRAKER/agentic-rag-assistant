# CodeQL is GitHub's code scanner. It builds a database of the code and runs
# security and quality queries over it, following data from where it enters
# (files, settings, model output) to where it is used. Findings appear in the
# repository's Security tab and as annotations on pull requests.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so new CodeQL queries also check code that hasn't changed.
    - cron: "30 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write  # upload the results to the Security tab
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: python
          build-mode: none  # Python is analysed from source; nothing to compile
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"
