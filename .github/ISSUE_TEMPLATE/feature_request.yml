name: Feature request
description: Suggest an idea or an improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation, not the solution yet. "When I ask about X, I can't tell whether ..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: dropdown
    id: area
    attributes:
      label: Which part of the assistant?
      options:
        - Ingestion (loading, chunking, embeddings, Qdrant)
        - Answering and citations
        - Agent (routing, reranking, self-check)
        - Chat UI or Docker
        - Evaluation
        - Developer experience (CI, tooling, docs)
    validations:
      required: true
